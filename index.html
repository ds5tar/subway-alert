<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<body>
<title>지하철 역알림</title>
<!-- 수도권 지하철 도착역 음성 안내 앱 본문 (build.py가 index.html·artifact.html로 조립) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 위 역 표지판 헤더, 가운데 노선도, 아래 조작 패널 (한 화면 앱) */
:root {
  --bg: #eef1f4; --surface: #ffffff; --fg: #111c27; --muted: #5b6a79; --line: #d5dce3;
  --sign: #12263a; --sign-fg: #ffffff; --sign-accent: #ffd23f;
  --visit: #e0322b; --me: #1a73e8; --ok: #1e8e3e; --warn: #c26401;
  --map-bg: #f8fafb; --label: #2b3a48; --label-halo: #f8fafb;
  --tile-filter: none; --tile-opacity: .55;
  --font: "IBM Plex Sans KR", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1319; --surface: #141e27; --fg: #e6edf3; --muted: #93a3b3; --line: #26343f;
  --sign: #0a1b2b; --sign-fg: #f2f6fa; --sign-accent: #ffd23f;
  --visit: #ff5a4e; --me: #5aa2ff; --ok: #4cc26b; --warn: #ffa24a;
  --map-bg: #101920; --label: #c9d4de; --label-halo: #101920; color-scheme: dark;
  --tile-filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.85); --tile-opacity: .5; } }
:root[data-theme="dark"] {
  --bg: #0c1319; --surface: #141e27; --fg: #e6edf3; --muted: #93a3b3; --line: #26343f;
  --sign: #0a1b2b; --sign-fg: #f2f6fa; --sign-accent: #ffd23f;
  --visit: #ff5a4e; --me: #5aa2ff; --ok: #4cc26b; --warn: #ffa24a;
  --map-bg: #101920; --label: #c9d4de; --label-halo: #101920; color-scheme: dark;
  --tile-filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.85); --tile-opacity: .5; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); }
#app { height: 100%; display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }

.sign { background: var(--sign); color: var(--sign-fg); padding: 10px 16px 12px; display: grid; gap: 4px; }
.sign-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .04em; }
.brand { font-weight: 700; }
.gps { display: inline-flex; align-items: center; gap: 6px; opacity: .9; font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #7d8b99; }
.dot.on { background: var(--ok); } .dot.weak { background: var(--warn); } .dot.off { background: var(--visit); }
.now { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.now-label { font-size: 12px; opacity: .75; white-space: nowrap; }
#nowName { font-size: 30px; font-weight: 700; letter-spacing: -.01em; color: var(--sign-accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#destInfo { font-size: 13px; opacity: .9; min-height: 1.4em; }

#mapWrap { position: relative; flex: 1; min-height: 200px; background: var(--map-bg); overflow: hidden; touch-action: none; }
#map { position: relative; width: 100%; height: 100%; display: block; }
#tiles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
#tiles img { position: absolute; max-width: none; user-select: none; opacity: var(--tile-opacity); filter: var(--tile-filter); }
.osm-attr { position: absolute; left: 6px; bottom: 4px; font-size: 10px; color: var(--muted); background: var(--surface); padding: 1px 5px; border-radius: 4px; opacity: .85; }
.osm-attr a { color: inherit; }
#mapWrap.noosm #tiles, #mapWrap.noosm .osm-attr { display: none; }
#map .seg { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3.5px; opacity: .9; }
#map .st { r: var(--r); fill: var(--map-bg); stroke: var(--label); stroke-width: 1px; }
#map .st.xfer { r: calc(var(--r) * 1.35); stroke-width: 1.6px; }
#map .st.visited { fill: var(--visit); stroke: var(--visit); }
#map .st.dest { fill: var(--sign-accent); stroke: var(--fg); stroke-width: 2px; r: calc(var(--r) * 1.8); }
#map .trail { fill: none; stroke: var(--visit); stroke-width: 8px; stroke-opacity: .45; stroke-linecap: round; stroke-linejoin: round; }
#map .lbl { fill: var(--label); paint-order: stroke; stroke: var(--label-halo); stroke-width: 3px; font-family: var(--font); pointer-events: none; }
#map .lbl.hot { fill: var(--visit); font-weight: 700; }
#map.nolabels .lbl:not(.hot) { display: none; }
#map .me { fill: var(--me); stroke: #fff; stroke-width: 2px; }
#map .acc { fill: var(--me); fill-opacity: .12; stroke: var(--me); stroke-opacity: .4; stroke-width: 1px; }
#map .cur { fill: none; stroke: var(--sign-accent); stroke-width: 3px; }
.map-btns { position: absolute; right: 12px; bottom: 12px; display: grid; gap: 8px; }
.fab { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; box-shadow: 0 2px 6px rgb(0 0 0 / .15); }
[hidden] { display: none !important; }
.pop { position: absolute; left: 12px; right: 12px; top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; box-shadow: 0 4px 16px rgb(0 0 0 / .18); }
.suggest { position: absolute; left: 12px; right: 12px; bottom: 8px; max-height: calc(100% - 16px); overflow-y: auto; margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / .25); z-index: 5; }
.suggest li { display: flex; align-items: center; gap: 8px; padding: 11px 10px; border-radius: 8px; cursor: pointer; }
.suggest li + li { border-top: 1px solid var(--line); }
.suggest li.on, .suggest li:hover { background: var(--bg); }
.suggest .nm { font-size: 16px; font-weight: 500; }
.suggest .ln { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.suggest .ln i { font-style: normal; font-size: 11px; color: #fff; padding: 1px 6px; border-radius: 9px; white-space: nowrap; }
.suggest .none { color: var(--muted); cursor: default; }
.pop b { font-size: 17px; margin-right: auto; }
.pop small { width: 100%; color: var(--muted); }

.panel { background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; max-height: 46%; overflow-y: auto; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.field { flex: 1 1 180px; display: flex; gap: 6px; }
.field input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.btn.primary { background: var(--me); border-color: var(--me); color: #fff; font-weight: 700; }
.btn.primary.stop { background: var(--visit); border-color: var(--visit); }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.msg { font-size: 13px; color: var(--muted); }
.msg.err { color: var(--visit); }
details { border-top: 1px solid var(--line); padding-top: 8px; }
summary { font-weight: 500; cursor: pointer; }
ol.trail { margin: 8px 0 0; padding-left: 26px; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
ol.trail li span { color: var(--muted); font-size: 12px; margin-left: 6px; }
.set { display: grid; gap: 10px; margin-top: 8px; }
.set label { display: grid; gap: 4px; font-size: 14px; }
.set audio { width: 100%; }
</style>

<div id="app">
  <header class="sign">
    <div class="sign-top">
      <span class="brand">지하철 역알림 · 수도권</span>
      <span class="gps"><span id="gpsDot" class="dot"></span><span id="gpsText">위치 꺼짐</span></span>
    </div>
    <div class="now"><span class="now-label">현재 역</span><span id="nowName">—</span></div>
    <div id="destInfo">도착역을 고르면 2정거장 전에 미리 알려 드립니다.</div>
  </header>

  <div id="mapWrap">
    <div id="tiles" aria-hidden="true"></div>
    <svg id="map" class="nolabels" aria-label="수도권 지하철 노선도"></svg>
    <div class="osm-attr">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>
    <div id="pop" class="pop" hidden></div>
    <ul id="suggest" class="suggest" role="listbox" aria-label="역 검색 결과" hidden></ul>
    <div class="map-btns">
      <button class="fab" id="zoomIn" aria-label="확대">+</button>
      <button class="fab" id="zoomOut" aria-label="축소">−</button>
      <button class="fab" id="locate" aria-label="현재 위치로">◎</button>
    </div>
  </div>

  <section class="panel">
    <div class="row">
      <div class="field">
        <input id="destInput" placeholder="도착역 검색 (예: 강남, ㄱㄴ)" autocomplete="off" enterkeyhint="search" role="combobox" aria-controls="suggest" aria-expanded="false">
        <button class="btn" id="destClear" aria-label="도착역 지우기">✕</button>
      </div>
    </div>
    <div class="row">
      <button class="btn primary" id="startBtn">안내 시작</button>
      <label class="chk"><input type="checkbox" id="simChk"> 시뮬레이션</label>
      <button class="btn" id="clearTrail">기록 지우기</button>
    </div>
    <div id="msg" class="msg">안내 시작을 누르면 위치 권한을 묻습니다. 시뮬레이션을 켜면 지도에서 역을 눌러 이동을 흉내 낼 수 있습니다.</div>
    <details open>
      <summary>지나온 역 <span id="trailCount">0</span></summary>
      <ol class="trail" id="trailList"></ol>
    </details>
    <details>
      <summary>설정</summary>
      <div class="set">
        <label>도착 판정 반경 <b id="radiusVal">300 m</b>
          <input type="range" id="radius" min="100" max="800" step="50" value="300"></label>
        <label>안내 중 배경음 크기 <b id="duckVal">25 %</b>
          <input type="range" id="duck" min="0" max="80" step="5" value="25"></label>
        <label class="chk"><input type="checkbox" id="osmChk" checked> 배경 지도 (오픈스트리트맵, 데이터 사용)</label>
        <div class="row"><button class="btn" id="testVoice">음성 테스트</button><span class="msg" id="engine"></span></div>
        <label>앱 안에서 음악 재생 (덕킹 확인용)
          <input type="file" id="musicFile" accept="audio/*"></label>
        <audio id="music" controls loop hidden></audio>
      </div>
    </details>
  </section>
</div>

const ST = DATA.stations;                 // 역명 -> [위도, 경도]
const NAMES = Object.keys(ST);
const ADJ = {};                            // 역명 -> Set(인접역)
const LINES_OF = {};                       // 역명 -> Set(노선명)
for (const ln of DATA.lines) for (const seg of ln.segs) {
  seg.forEach((s, i) => {
    (LINES_OF[s] ||= new Set()).add(ln.name);
    ADJ[s] ||= new Set();
    if (i > 0) { ADJ[s].add(seg[i - 1]); ADJ[seg[i - 1]].add(s); }
  });
}
const LAT0 = 37.55, LNG0 = 126.98, KX = 111320 * Math.cos(LAT0 * Math.PI / 180), KY = 110570;
const proj = ([lat, lng]) => [(lng - LNG0) * KX, -(lat - LAT0) * KY]; // 미터 단위 평면 (작은 좌표는 크롬 SVG 글자 렌더링이 깨짐)

function distM(a, b) { // 하버사인 거리(m)
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function nearest(pos) {
  let best = null, bd = Infinity;
  for (const n of NAMES) { const d = distM(pos, ST[n]); if (d < bd) { bd = d; best = n; } }
  return { name: best, dist: bd };
}
function hops(from, to) { // 환승 포함 최소 정거장 수 (BFS)
  if (from === to) return 0;
  const seen = new Set([from]); let frontier = [from], d = 0;
  while (frontier.length) {
    d++; const next = [];
    for (const s of frontier) for (const t of ADJ[s] || []) {
      if (t === to) return d;
      if (!seen.has(t)) { seen.add(t); next.push(t); }
    }
    frontier = next;
  }
  return Infinity;
}
const spoken = n => n.replace(/\(.*?\)/g, '').trim() + '역';

  koVoice = vs.find(v => /^ko/i.test(v.lang) && v.localService) || vs.find(v => /^ko/i.test(v.lang)) || null;
  $('engine').textContent = koVoice ? `브라우저 음성: ${koVoice.name}` : 'speechSynthesis' in window ? '한국어 음성을 찾는 중…' : '이 브라우저는 음성 안내를 지원하지 않습니다.';
}
pickVoice();
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = pickVoice;

const ducked = new Map();
function duckPage() {
  document.querySelectorAll('audio, video').forEach(m => {
    if (!m.paused && !ducked.has(m)) { ducked.set(m, m.volume); m.volume = Math.max(0, m.volume * S.duck); }
  });
}
function restorePage() { ducked.forEach((v, m) => { m.volume = v; }); ducked.clear(); }

let restoreTimer = null;
function speak(text) {
  $('msg').className = 'msg'; $('msg').textContent = '🔊 ' + text;
  duckPage();
  if (!('speechSynthesis' in window)) { restorePage(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice; u.rate = 1;
  const done = () => { clearTimeout(restoreTimer); setTimeout(restorePage, 300); };
  u.onend = done; u.onerror = done;
  clearTimeout(restoreTimer); restoreTimer = setTimeout(restorePage, 2500 + text.length * 250);
  speechSynthesis.speak(u);
}

// ---------- 도착 처리 ----------
function arrive(name) {
  if (name === S.current) return;
  S.current = name;
  S.trail.push({ name, t: new Date() });
  let text = `${spoken(name)}에 도착합니다.`;
  if (S.dest) {
    if (name === S.dest) { text += ' 내리실 역입니다.'; S.warned = true; }
    else if (!S.warned) {
      const h = hops(name, S.dest);
      if (h === 2) { text += ` 2정거장 뒤 ${spoken(S.dest)}에 도착 예정입니다. 내리실 준비를 하세요.`; S.warned = true; }
      else if (h === 1) { text += ` 다음 역은 ${spoken(S.dest)}, 내리실 역입니다.`; S.warned = true; }
    }
  }
  speak(text);
  render();
}

function onFix(lat, lng, acc) {
  S.me = [lat, lng]; S.acc = acc;
  showAcc(acc);
  const n = nearest(S.me);
  if (acc <= 1000 && n.dist <= S.radius) {
    if (S.cand === n.name) S.candCount++; else { S.cand = n.name; S.candCount = 1; }
    if (S.candCount >= (acc <= 100 ? 1 : 2)) arrive(n.name);
  } else { S.cand = null; S.candCount = 0; }
  drawMe();
}

function showAcc(acc) {
  $('gpsDot').className = 'dot ' + (acc <= 150 ? 'on' : acc <= 600 ? 'weak' : 'off');
  $('gpsText').textContent = `정확도 ±${Math.round(acc)} m`;
}

// ---------- 위치 ----------
// 앱을 열면 내 위치를 한 번 찾아 지도 가운데에 두고 가장 가까운 역을 알려 준다 (안내·도착 판정은 하지 않음)

  navigator.geolocation.getCurrentPosition(p => {
    if (S.running) return;   // 이미 안내 중이면 위치 감시가 처리
    S.me = [p.coords.latitude, p.coords.longitude]; S.acc = p.coords.accuracy;
    showAcc(S.acc);
    centerOn(proj(S.me));
    const n = nearest(S.me), d = n.dist < 1000 ? `${Math.round(n.dist)} m` : `${(n.dist / 1000).toFixed(1)} km`;
    const prev = $('msg').textContent.startsWith('지난번') ? ' ' + $('msg').textContent : '';
    $('msg').className = 'msg';
    $('msg').textContent = `현재 위치를 찾았습니다. 가장 가까운 역은 ${n.name} (${d}).` + prev;
  }, e => {
    if (S.running) return;
    $('gpsDot').className = 'dot off'; $('gpsText').textContent = e.code === 1 ? '위치 권한 없음' : '위치 못 찾음';
    if (e.code === 1) showErr('위치 권한이 거부되었습니다. 설정에서 위치를 허용하거나 시뮬레이션을 켜 주세요.');
  }, { enableHighAccuracy: true, maximumAge: 60000, timeout: 15000 });
}
function startGeo() {
  if (!('geolocation' in navigator)) { showErr('이 브라우저는 위치 기능을 지원하지 않습니다. 시뮬레이션을 켜 주세요.'); return false; }
  S.watchId = navigator.geolocation.watchPosition(
    p => onFix(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
    e => {
      $('gpsDot').className = 'dot off'; $('gpsText').textContent = '위치 오류';
      showErr(e.code === 1 ? '위치 권한이 거부되었습니다. 설정에서 위치를 허용하거나 시뮬레이션을 켜 주세요.'
        : '위치를 잡지 못했습니다. 지하 구간이면 잠시 기다려 주세요.');
    },
    { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
  return true;
}

  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') S.wake = await navigator.wakeLock.request('screen'); } catch (e) { /* 거부돼도 동작은 계속 */ }
}
document.addEventListener('visibilitychange', () => { if (S.running && document.visibilityState === 'visible') keepAwake(); });
function showErr(t) { $('msg').className = 'msg err'; $('msg').textContent = t; }

function setRunning(on) {
  S.running = on;
  $('startBtn').textContent = on ? '안내 중지' : '안내 시작';
  $('startBtn').classList.toggle('stop', on);
  if (on) {
    speak('역 도착 안내를 시작합니다.');    // 사용자 탭 안에서 첫 발화 → 음성 잠금 해제
    keepAwake();
    if (!S.sim) startGeo();
  } else {
    stopGeo();
    try { S.wake && S.wake.release(); } catch (e) {}
    S.wake = null;
    $('gpsDot').className = 'dot'; $('gpsText').textContent = '위치 꺼짐';
  }
}

// ---------- 지도 ----------
const svg = $('map'), NS = 'http://www.w3.org/2000/svg', tilesEl = $('tiles'), tileImgs = new Map();
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const gLines = el('g', {}, svg), gTrail = el('g', {}, svg), gSt = el('g', {}, svg), gLbl = el('g', {}, svg), gMe = el('g', {}, svg);
const P = {}; NAMES.forEach(n => P[n] = proj(ST[n]));
for (const ln of DATA.lines) for (const seg of ln.segs) {
  const pl = el('polyline', { class: 'seg', points: seg.map(s => P[s].join(',')).join(' '), stroke: ln.color }, gLines);
  pl.setAttribute('vector-effect', 'non-scaling-stroke');
  el('title', {}, pl).textContent = ln.name;
}
const circ = {}, lbl = {};
for (const n of NAMES) {
  const xfer = LINES_OF[n].size > 1;
  circ[n] = el('circle', { class: 'st' + (xfer ? ' xfer' : ''), cx: P[n][0], cy: P[n][1] }, gSt);
  circ[n].setAttribute('vector-effect', 'non-scaling-stroke');
  lbl[n] = el('text', { class: 'lbl', x: P[n][0], y: P[n][1] }, gLbl);
  lbl[n].textContent = n;
}
const trailLine = el('polyline', { class: 'trail' }, gTrail); trailLine.setAttribute('vector-effect', 'non-scaling-stroke');
const accC = el('circle', { class: 'acc' }, gMe), meC = el('circle', { class: 'me' }, gMe), curC = el('circle', { class: 'cur' }, gMe);
[accC, meC, curC].forEach(c => c.setAttribute('vector-effect', 'non-scaling-stroke'));

let vb = { x: -20000, y: -16000, w: 40000, h: 32000 };   // 미터 단위 뷰박스
function pxPerUnit() { const r = svg.getBoundingClientRect(); return Math.min(r.width / vb.w, r.height / vb.h) || 0.01; }
function applyView() {
  const r = svg.getBoundingClientRect();
  const k = pxPerUnit();
  // 화면 비율에 맞춰 viewBox 보정
  const w = r.width / k, h = r.height / k;
  vb.x += (vb.w - w) / 2; vb.y += (vb.h - h) / 2; vb.w = w; vb.h = h;
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.style.setProperty('--r', (Math.max(1.6, Math.min(3.2, k * 150)) / k) + 'px');   // 축소 시 역 점을 작게
  gLbl.setAttribute('font-size', 11.5 / k);
  gLbl.querySelectorAll('text').forEach(t => { t.setAttribute('dx', 6 / k); t.setAttribute('dy', 4 / k); });
  gLbl.style.strokeWidth = (3 / k) + 'px';
  svg.classList.toggle('nolabels', k < 0.038);
  drawMe();
  drawTiles();
}
// 배경 지도: 오픈스트리트맵 타일을 지금 보이는 범위에 깐다 (타일 모서리를 노선도 좌표로 바꿔 위치를 맞춤)
function drawTiles() {
  if (!S.osm) { tilesEl.replaceChildren(); tileImgs.clear(); return; }
  const k = pxPerUnit(), toLL = (x, y) => [LAT0 - y / KY, x / KX + LNG0];
  const [nwLat, nwLng] = toLL(vb.x, vb.y), [seLat, seLng] = toLL(vb.x + vb.w, vb.y + vb.h);
  const tx = (lng, z) => Math.floor((lng + 180) / 360 * 2 ** z);
  const ty = (lat, z) => { const t = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(t) + 1 / Math.cos(t)) / Math.PI) / 2 * 2 ** z); };
  const lngOf = (x, z) => x / 2 ** z * 360 - 180, latOf = (y, z) => Math.atan(Math.sinh(Math.PI - 2 * Math.PI * y / 2 ** z)) * 180 / Math.PI;
  let z = Math.max(5, Math.min(19, Math.round(Math.log2(156543.03 * Math.cos((nwLat + seLat) / 2 * Math.PI / 180) * k))));
  while (z > 5 && (tx(seLng, z) - tx(nwLng, z) + 1) * (ty(seLat, z) - ty(nwLat, z) + 1) > 80) z--;   // 타일 수 제한
  const used = new Set();
  for (let x = tx(nwLng, z); x <= tx(seLng, z); x++) for (let y = ty(nwLat, z); y <= ty(seLat, z); y++) {
    const key = `${z}/${x}/${y}`; used.add(key);
    let img = tileImgs.get(key);
    if (!img) { img = new Image(); img.alt = ''; img.decoding = 'async'; img.src = `https://tile.openstreetmap.org/${key}.png`; tileImgs.set(key, img); tilesEl.appendChild(img); }
    const a = proj([latOf(y, z), lngOf(x, z)]), b = proj([latOf(y + 1, z), lngOf(x + 1, z)]);
    const l = Math.round((a[0] - vb.x) * k), t = Math.round((a[1] - vb.y) * k);
    img.style.left = l + 'px'; img.style.top = t + 'px';
    img.style.width = (Math.round((b[0] - vb.x) * k) - l) + 'px'; img.style.height = (Math.round((b[1] - vb.y) * k) - t) + 'px';
  }

}
function zoomAt(f, cx, cy) { // f>1 확대, (cx,cy)는 지도 좌표(m)
  const nw = Math.min(Math.max(vb.w / f, 1500), 260000);
  const s = nw / vb.w;
  vb.x = cx - (cx - vb.x) * s; vb.y = cy - (cy - vb.y) * s; vb.w = nw; vb.h *= s;
  applyView();
  savePrefs();
}
function centerOn(pt, w) { if (w) { vb.h *= w / vb.w; vb.w = w; } vb.x = pt[0] - vb.w / 2; vb.y = pt[1] - vb.h / 2; applyView(); if (w) savePrefs(); }
function setScale(k) { // 축척(화면 px / 지도 m)을 지정, 화면 가운데는 유지
  const r = svg.getBoundingClientRect(), cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2;
  vb.w = Math.min(Math.max(r.width / k, 1500), 260000); vb.h = vb.w * r.height / r.width;

}
function toMap(clientX, clientY) { const r = svg.getBoundingClientRect(); return [vb.x + (clientX - r.left) / r.width * vb.w, vb.y + (clientY - r.top) / r.height * vb.h]; }

// 이동·확대(마우스 휠, 한 손가락 드래그, 두 손가락 핀치)
const ptrs = new Map(); let moved = false, pinch0 = null;
svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = false; pinch0 = null; });
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) {
    const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    const k = pxPerUnit(); vb.x -= dx / k; vb.y -= dy / k; applyView();
  } else if (ptrs.size === 2) {
    moved = true;
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const mid = toMap((a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    if (pinch0) zoomAt(d / pinch0, mid[0], mid[1]);

});
const endPtr = e => {
  if (ptrs.size === 1 && !moved) tapAt(e.clientX, e.clientY);
  ptrs.delete(e.pointerId); pinch0 = null;
};
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch0 = null; });
svg.addEventListener('wheel', e => { e.preventDefault(); const p = toMap(e.clientX, e.clientY); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, p[0], p[1]); }, { passive: false });
$('zoomIn').onclick = () => zoomAt(1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
$('zoomOut').onclick = () => zoomAt(1 / 1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
$('locate').onclick = () => { const t = S.me ? proj(S.me) : S.current ? P[S.current] : null; if (t) centerOn(t, Math.min(vb.w, 8000)); };
new ResizeObserver(applyView).observe(svg);

function tapAt(cx, cy) {
  const p = toMap(cx, cy), k = pxPerUnit();

  for (const n of NAMES) { const d = Math.hypot(P[n][0] - p[0], P[n][1] - p[1]); if (d < bd) { bd = d; best = n; } }
  if (bd * k > 24) { $('pop').hidden = true; return; }
  showPop(best);
}
function showPop(n) {
  const pop = $('pop');
  pop.innerHTML = '';
  const b = document.createElement('b'); b.textContent = n; pop.appendChild(b);
  const mk = (label, fn, cls) => { const x = document.createElement('button'); x.className = 'btn' + (cls ? ' ' + cls : ''); x.textContent = label; x.onclick = fn; pop.appendChild(x); };
  mk('도착역으로', () => { setDest(n); pop.hidden = true; });
  if (S.sim) mk('여기 도착', () => { simArrive(n); pop.hidden = true; }, 'primary');
  mk('닫기', () => { pop.hidden = true; });
  const s = document.createElement('small'); s.textContent = [...LINES_OF[n]].join(' · '); pop.appendChild(s);
  pop.hidden = false;
}
function simArrive(n) {
  if (!S.running) setRunning(true);
  const [lat, lng] = ST[n];
  onFix(lat + 0.0004, lng + 0.0003, 30);   // 역에서 약 50m 떨어진 가짜 위치
}

function drawMe() {
  const k = pxPerUnit();
  if (S.me) {
    const p = proj(S.me);
    meC.setAttribute('cx', p[0]); meC.setAttribute('cy', p[1]); meC.setAttribute('r', 6 / k);
    accC.setAttribute('cx', p[0]); accC.setAttribute('cy', p[1]); accC.setAttribute('r', Math.max(S.acc, 6 / k));

    const p = P[S.current];
    curC.setAttribute('cx', p[0]); curC.setAttribute('cy', p[1]); curC.setAttribute('r', 11 / k); curC.style.display = '';
  } else curC.style.display = 'none';
}

// ---------- 화면 갱신 ----------

// ---------- 조작 ----------
// 역 검색: 브라우저 자동완성(datalist)은 삼성 인터넷 등에서 목록이 안 보여 직접 그린다
const LINE_COLOR = {}; DATA.lines.forEach(l => LINE_COLOR[l.name] = l.color);
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const chosung = str => [...str].map(c => { const k = c.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : c; }).join('');
const SORTED = [...NAMES].sort((a, b) => a.localeCompare(b, 'ko'));
const CHO_OF = {}; SORTED.forEach(n => CHO_OF[n] = chosung(n));
function searchStations(q) {
  q = q.replace(/\s+/g, '').replace(/역$/, '');
  if (!q) return [];
  const onlyCho = /^[ㄱ-ㅎ]+$/.test(q);
  const hits = SORTED.filter(n => onlyCho ? CHO_OF[n].includes(q) : n.includes(q) || CHO_OF[n].includes(q));
  const rank = n => (n === q ? 0 : (onlyCho ? CHO_OF[n] : n).startsWith(q) ? 1 : 2);
  return hits.sort((a, b) => rank(a) - rank(b) || a.length - b.length).slice(0, 40);
}
let sugItems = [], sugIdx = -1;
function hideSuggest() { $('suggest').hidden = true; $('destInput').setAttribute('aria-expanded', 'false'); sugIdx = -1; }
function showSuggest() {
  const q = $('destInput').value.trim(), ul = $('suggest');
  if (!q) { hideSuggest(); return; }
  sugItems = searchStations(q); sugIdx = sugItems.length ? 0 : -1;
  ul.innerHTML = '';
  if (!sugItems.length) {
    const li = document.createElement('li'); li.className = 'none'; li.textContent = `'${q}'와(과) 맞는 역이 없습니다.`; ul.appendChild(li);
  }
  sugItems.forEach((n, i) => {
    const li = document.createElement('li'); li.setAttribute('role', 'option'); if (i === 0) li.className = 'on';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = n; li.appendChild(nm);
    const ln = document.createElement('span'); ln.className = 'ln';
    LINES_OF[n].forEach(l => { const t = document.createElement('i'); t.textContent = l; t.style.background = LINE_COLOR[l]; ln.appendChild(t); });
    li.appendChild(ln);
    li.addEventListener('pointerdown', e => e.preventDefault());   // 입력창 포커스 유지(목록이 먼저 닫히지 않게)
    li.addEventListener('click', () => pickSuggest(n));
    ul.appendChild(li);
  });

}
function pickSuggest(n) { hideSuggest(); setDest(n); $('destInput').blur(); }
$('destInput').addEventListener('input', showSuggest);
$('destInput').addEventListener('focus', () => { $('pop').hidden = true; showSuggest(); });
$('destInput').addEventListener('blur', () => setTimeout(hideSuggest, 150));
$('destInput').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!sugItems.length) return; e.preventDefault();
    sugIdx = (sugIdx + (e.key === 'ArrowDown' ? 1 : -1) + sugItems.length) % sugItems.length;
    [...$('suggest').children].forEach((li, i) => li.classList.toggle('on', i === sugIdx));
    $('suggest').children[sugIdx].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (e.isComposing) return;
    const v = $('destInput').value.trim();
    if (!v) { hideSuggest(); setDest(null); return; }
    const list = searchStations(v);
    if (list.length) pickSuggest(sugIdx >= 0 && sugItems[sugIdx] ? sugItems[sugIdx] : list[0]);
    else showErr(`'${v}'와(과) 맞는 역이 없습니다. 역 이름을 확인해 주세요.`);
  } else if (e.key === 'Escape') hideSuggest();
});
$('destClear').onclick = () => setDest(null);
$('startBtn').onclick = () => setRunning(!S.running);
$('simChk').onchange = e => {
  S.sim = e.target.checked;
  if (S.running) { if (S.sim) stopGeo(); else startGeo(); }
  $('msg').className = 'msg';
  $('msg').textContent = S.sim ? '시뮬레이션: 지도에서 역을 누르고 "여기 도착"을 누르세요.' : '실제 위치로 안내합니다.';
};
$('clearTrail').onclick = () => { S.trail = []; S.current = null; S.warned = false; render(); };
$('radius').oninput = e => { S.radius = +e.target.value; $('radiusVal').textContent = S.radius + ' m'; savePrefs(); };
$('duck').oninput = e => { S.duck = e.target.value / 100; $('duckVal').textContent = e.target.value + ' %'; savePrefs(); };
function setOsm(on) { S.osm = on; $('mapWrap').classList.toggle('noosm', !on); drawTiles(); }
$('osmChk').onchange = e => { setOsm(e.target.checked); savePrefs(); };
$('testVoice').onclick = () => speak('강남역에 도착합니다.');
$('musicFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const a = $('music'); a.src = URL.createObjectURL(f); a.hidden = false; a.play().catch(() => {});
};

// ---------- 도착역·설정 자동 저장 (이 기기 브라우저에만 저장) ----------
const PREFS_KEY = 'subwayAlert.prefs.v1';
function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ dest: S.dest, radius: S.radius, duck: Math.round(S.duck * 100), scale: pxPerUnit(), osm: S.osm })); } catch (e) { /* 저장 불가(사생활 모드 등)면 무시 */ }
}
function loadPrefs() {
  let p = null;
  try { p = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null'); } catch (e) { p = null; }
  if (!p) return;
  if (p.scale > 0 && isFinite(p.scale)) setScale(p.scale);   // 마지막으로 쓴 지도 축척
  if (p.osm === false) { $('osmChk').checked = false; setOsm(false); }
  if (p.radius >= 100 && p.radius <= 800) { $('radius').value = p.radius; $('radius').oninput({ target: $('radius') }); }
  if (p.duck >= 0 && p.duck <= 80) { $('duck').value = p.duck; $('duck').oninput({ target: $('duck') }); }
  if (p.dest && ST[p.dest]) {
    setDest(p.dest);
    $('msg').textContent = `지난번 도착역 ${p.dest}을(를) 불러왔습니다. 2정거장 전에 음성으로 알려 드립니다.`;
  }
}

applyView();
render();
loadPrefs();
locateOnce();
</script>
